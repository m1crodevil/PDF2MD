# Portable template — copy to pdf2md.local.toml for machine-specific values.
# config/pdf2md.local.toml is gitignored and overrides this file when present.
[reconstruct]
json_dir = "./json"
source_pdf = "./input.pdf"
outdir = "./output"
api_key_env = "PDF2MD_API_KEY"
env_file = "./.env"
# Set in config/pdf2md.local.toml, PDF2MD_BASE_URL, or --base-url.
base_url = ""
model = "cx/gpt-5.6-luna"
concurrency = 2
reasoning_effort = "none"

[ocr]
pdf = "./input.pdf"
outdir = "./json"
dpi = 150
helper = "scripts/ocr_helper.py"
