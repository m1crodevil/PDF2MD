[reconstruct]
json_dir = "/path/to/pdf2md/data/json"
outdir = "/path/to/pdf2md/data/md_pages"
api_key_env = "PDF2MD_API_KEY"
env_file = "/path/to/secrets/.env"
base_url = "https://api.example.com/v1"
model = "combo/murah"

[ocr]
pdf = "./input.pdf"
outdir = "./json"
total = 222
start = 1
dpi = 150
helper = "scripts/ocr_helper.py"
