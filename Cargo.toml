[package]
name = "pdf2md"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
pdf_oxide = "0.3"
pdfium-render = { version = "0.9.3", optional = true }

[features]
default = []
pdfium = ["dep:pdfium-render"]

[profile.release]
opt-level = 3
