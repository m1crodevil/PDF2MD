name: quality-gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: git diff --check
      - run: python3 scripts/check_repo_hygiene.py
      - run: python3 scripts/evaluate_quality.py --fixtures tests/fixtures/quality --min-numeric-recall 1.0
      - run: python3 scripts/check_regression_fixture.py tests/fixtures/legal-regression
